<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Analysis Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Digit Analysis Tool</h1>

<select id="market">

    <optgroup label="Volatility Indices (1s)">
        <option value="1HZ10V">Volatility 10 (1s)</option>
        <option value="1HZ25V">Volatility 25 (1s)</option>
        <option value="1HZ50V">Volatility 50 (1s)</option>
        <option value="1HZ75V">Volatility 75 (1s)</option>
        <option value="1HZ100V">Volatility 100 (1s)</option>
    </optgroup>

    <optgroup label="Volatility Indices">
        <option value="R_10">Volatility 10</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_100">Volatility 100</option>
    </optgroup>

    <optgroup label="Jump Indices">
        <option value="JD10">Jump 10</option>
        <option value="JD25">Jump 25</option>
        <option value="JD50">Jump 50</option>
        <option value="JD75">Jump 75</option>
        <option value="JD100">Jump 100</option>
    </optgroup>

</select>

<h2>Live Digit</h2>
<h1 id="digit">-</h1>

<h2>Digit Frequency</h2>

<table>
<tr><td>0</td><td id="d0">0</td></tr>
<tr><td>1</td><td id="d1">0</td></tr>
<tr><td>2</td><td id="d2">0</td></tr>
<tr><td>3</td><td id="d3">0</td></tr>
<tr><td>4</td><td id="d4">0</td></tr>
<tr><td>5</td><td id="d5">0</td></tr>
<tr><td>6</td><td id="d6">0</td></tr>
<tr><td>7</td><td id="d7">0</td></tr>
<tr><td>8</td><td id="d8">0</td></tr>
<tr><td>9</td><td id="d9">0</td></tr>
</table>
<h2>Last Digits</h2>

<div id="history"></div>
<script src="script.js"></script>

</body>
</html>
